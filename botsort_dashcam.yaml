# BoT-SORT tuned for moving-camera/dashcam video.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.80
fuse_score: True

# Compensate global image motion caused by the moving camera.
gmc_method: sparseOptFlow

# ReID is intentionally disabled: it would require another model and more GPU.
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: False
model: auto

